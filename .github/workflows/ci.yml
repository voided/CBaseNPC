name: Experimental x64 CI

on:
  push:
    branches: [feature/x64]
  pull_request:
    branches: [feature/x64]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCEMOD_BRANCH: master
  LIBFFI_VERSION: 3.5.2
  LIBFFI_SHA256: f3a3082a23b37c293a4fcd1053147b371f2ff91fa7ea1b2a52e335676bac82dc
  VCPKG_REF: 2025.12.12

jobs:
  build-plugins:
    name: SourcePawn
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AMBuild
        run: python -m pip install git+https://github.com/alliedmodders/ambuild.git

      - name: Build example plugins
        run: |
          git clone --depth 1 --branch "$SOURCEMOD_BRANCH" \
            https://github.com/alliedmodders/sourcemod.git sourcemod
          compiler=$(docker create "ghcr.io/alliedmodders/sourcemod-spcomp:$SOURCEMOD_BRANCH")
          trap 'docker rm "$compiler" >/dev/null' EXIT
          docker cp "$compiler:/usr/local/bin/spcomp" "$RUNNER_TEMP/spcomp"
          mkdir build
          cd build
          python ../configure.py --scripting-only \
            --spcomp-path "$RUNNER_TEMP/spcomp" \
            --sm-api-path "$GITHUB_WORKSPACE/sourcemod/plugins/include"
          ambuild

      - name: Upload example plugins
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: build/package/addons/sourcemod/plugins/disabled/*.smx
          if-no-files-found: error

  build-extension:
    name: ${{ matrix.target.os_name }}-${{ matrix.target.arch }}
    needs: build-plugins
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            os_name: linux
            container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
            python: python3
            suffix: so
            arch: x86
            host: i686-pc-linux-gnu
            bits: 32
          - runner: ubuntu-latest
            os_name: linux
            container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
            python: python3
            suffix: so
            arch: x86_64
            host: x86_64-pc-linux-gnu
            bits: 64
          - runner: windows-latest
            os_name: windows
            python: python
            suffix: dll
            arch: x86
            msvc: x86
          - runner: windows-latest
            os_name: windows
            python: python
            suffix: dll
            arch: x86_64
            msvc: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target.msvc }}

      - name: Install AMBuild (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install git+https://github.com/alliedmodders/ambuild.git

      - name: Clone dependencies
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules -j8 \
            --branch "$SOURCEMOD_BRANCH" https://github.com/alliedmodders/sourcemod.git sourcemod
          git clone --depth 1 --recurse-submodules --shallow-submodules -j8 \
            --branch 1.12-dev https://github.com/alliedmodders/metamod-source.git mmsource
          git clone --depth 1 --branch tf2 https://github.com/alliedmodders/hl2sdk.git hl2sdk-tf2

      - name: Build static libffi (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.target.arch }}
          HOST: ${{ matrix.target.host }}
          BITS: ${{ matrix.target.bits }}
        run: |
          curl -fsSL "https://github.com/libffi/libffi/releases/download/v$LIBFFI_VERSION/libffi-$LIBFFI_VERSION.tar.gz" -o libffi.tar.gz
          printf '%s  libffi.tar.gz\n' "$LIBFFI_SHA256" | sha256sum -c -
          tar -xzf libffi.tar.gz
          cd "libffi-$LIBFFI_VERSION"
          ./configure --host="$HOST" --prefix="$GITHUB_WORKSPACE/libffi/$ARCH" \
            --disable-shared --enable-static --with-pic --disable-docs CC="clang-22 -m$BITS"
          make -j"$(nproc)"
          make install

      - name: Install static libffi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.target.arch }}
          MSVC_ARCH: ${{ matrix.target.msvc }}
        run: |
          $triplet = "${env:MSVC_ARCH}-windows-static"
          $vcpkg = Join-Path $env:RUNNER_TEMP vcpkg
          git clone --depth 1 --branch $env:VCPKG_REF https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkg/vcpkg.exe" install "libffi:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory libffi | Out-Null
          New-Item -ItemType Junction "libffi/$env:ARCH" -Target "$vcpkg/installed/$triplet" | Out-Null

      - name: Build extension
        shell: bash
        env:
          PYTHON: ${{ matrix.target.python }}
          EXTENSION_SUFFIX: ${{ matrix.target.suffix }}
          ARCH: ${{ matrix.target.arch }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            git config --global --add safe.directory "$PWD"
            export CC=clang-22 CXX=clang++-22
          fi
          mkdir build
          cd build
          "$PYTHON" ../configure.py \
            --extension-only --enable-optimize --enable-auto-versioning \
            --targets="$ARCH" --sdks=tf2 --libffi-root ../libffi \
            --sm-path ../sourcemod --mms-path ../mmsource --hl2sdk-root ..
          ambuild
          extension_dir=package/addons/sourcemod/extensions
          if [ "$ARCH" = x86_64 ]; then
            extension_dir+=/x64
          fi
          test -s "$extension_dir/cbasenpc.ext.2.tf2.$EXTENSION_SUFFIX"

      - name: Add example plugins to package
        uses: actions/download-artifact@v8
        with:
          name: plugins
          path: build/package/addons/sourcemod/plugins/disabled

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: experimental-${{ matrix.target.os_name }}-${{ matrix.target.arch }}
          path: build/package/
          if-no-files-found: error

      - name: Upload release version
        if: matrix.target.os_name == 'linux' && matrix.target.arch == 'x86_64' && github.ref == 'refs/heads/feature/x64'
        uses: actions/upload-artifact@v7
        with:
          name: release-version
          path: build/includes/git_action_release
          if-no-files-found: error

  release:
    name: Publish experimental x64 prerelease
    needs: build-extension
    if: github.ref == 'refs/heads/feature/x64' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble packages
        id: package
        run: |
          version=$(cat artifacts/release-version/git_action_release)
          mkdir assets
          tar -czf "assets/cbasenpc${version}-experimental-x64-linux.tar.gz" -C artifacts/experimental-linux-x86_64 addons
          (cd artifacts/experimental-windows-x86_64 && python3 -m zipfile -c "../../assets/cbasenpc${version}-experimental-x64-windows.zip" addons)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="$VERSION-experimental-x64-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CBaseNPC $VERSION Experimental x64" \
            --prerelease --latest=false \
            --notes "Experimental 64-bit TF2 build for SourceMod 1.13, built from $GITHUB_SHA."
